services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    environment:
      ELEXON_API_BASE_URL: ${ELEXON_API_BASE_URL:-https://data.elexon.co.uk/bmrs/api/v1}
      ELEXON_HTTP_PROXY: ${ELEXON_HTTP_PROXY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
